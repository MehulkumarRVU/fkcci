version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://pocketcoach:pocketcoach@postgres:5432/pocketcoach
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pocketcoach
      POSTGRES_PASSWORD: pocketcoach
      POSTGRES_DB: pocketcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
