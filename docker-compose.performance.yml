services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the isolated image under test}
    build: null
    env_file: !reset []
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --workers
      - ${PROFILE_UVICORN_WORKERS:-1}
    deploy:
      resources:
        limits:
          cpus: ${PROFILE_BACKEND_CPUS:-1.0}

  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
