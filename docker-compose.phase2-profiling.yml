services:
  backend:
    volumes:
      - ./scripts/phase2_profile_runtime.py:/app/backend/phase2_profile_runtime.py:ro
    command:
      - uvicorn
      - phase2_profile_runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --workers
      - ${PROFILE_UVICORN_WORKERS:-1}
