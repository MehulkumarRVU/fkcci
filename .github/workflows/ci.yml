name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure SECRET_KEY
        shell: bash
        run: |
          if [ -n "${{ secrets.SECRET_KEY }}" ]; then
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          else
            python - <<'PY' > /tmp/ci_secret
import secrets
print(secrets.token_urlsafe(48))
PY
            echo "SECRET_KEY=$(cat /tmp/ci_secret)" >> $GITHUB_ENV
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/dev-requirements.txt

      - name: Apply migrations
        run: python backend/app/migrate.py

      - name: Start backend server (integration friendly script)
        run: |
          chmod +x backend/scripts/start_server_for_tests.sh
          backend/scripts/start_server_for_tests.sh &
          # wait for health endpoint
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "backend healthy"
              break
            fi
            sleep 1
          done

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest -q
