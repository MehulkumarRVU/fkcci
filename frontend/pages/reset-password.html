<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PocketCoach AI</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="navbar-brand">🎯 PocketCoach AI</a>
            <ul class="navbar-nav">
                <li><a href="../index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 4rem; margin-bottom: 4rem;">
        <div id="alertContainer"></div>

        <div class="card">
            <h2 class="card-header">Set a New Password</h2>

            <div id="missingTokenState" class="hidden">
                <p>This reset link is missing or invalid. Please request a new one.</p>
                <a href="forgot-password.html" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">Request New Link</a>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-input" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-input" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
            </form>

            <div id="resetSuccessState" class="hidden">
                <p>Your password has been reset. You can now log in with your new password.</p>
                <a href="login.html" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">Go to Login</a>
            </div>
        </div>
    </div>

    <script src="../js/auth-utils.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
