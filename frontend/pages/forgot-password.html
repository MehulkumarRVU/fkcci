<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PocketCoach AI</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="navbar-brand">🎯 PocketCoach AI</a>
            <ul class="navbar-nav">
                <li><a href="../index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 4rem; margin-bottom: 4rem;">
        <div id="alertContainer"></div>

        <div class="card">
            <h2 class="card-header">Reset Your Password</h2>
            <div id="requestFormWrapper">
                <p style="color: var(--text-secondary);">Enter your account email and we'll send you a link to reset your password.</p>
                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="forgotEmail">Email</label>
                        <input type="email" id="forgotEmail" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
                </form>
            </div>
            <div id="requestSentState" class="hidden">
                <p>If that email is registered, we've sent password reset instructions to it. Check your inbox (and spam folder).</p>
                <a href="login.html" class="btn btn-outline" style="width: 100%; display: block; text-align: center;">Back to Login</a>
            </div>
            <p class="text-center mt-3">
                <a href="login.html" style="color: var(--primary-color); font-weight: 500;">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="../js/auth-utils.js?v=4"></script>
    <script src="../js/forgot-password.js?v=4"></script>
</body>
</html>
